// jk2coop: Xbox controller layout (works for any controller SDL recognises).
// Ships in zz-coop-ui.pk3; loaded by split screen (coop_splitscreen) and tools/windows/jk2coop-splitscreen.cmd. To use a controller in a normal game,
// type in the console:  in_joystick 1; vid_restart; exec jk2coop_gamepad.cfg
//
// Buttons are fixed:  A=JOY1 B=JOY2 X=JOY3 Y=JOY4 Back=JOY5 Guide=JOY6
//   Start=JOY7 (always the menu) LStick-click=JOY8 RStick-click=JOY9
//   LB=JOY10 RB=JOY11 Dpad up/down/left/right=JOY12/13/14/15 LT=JOY16 RT=JOY17
// Left stick moves (tilt a little to walk), right stick aims.
// Tuning: joy_yawSpeed / joy_pitchSpeed (turn speed), joy_lookCurve,
//   joy_invertY 1, joy_deadzone / joy_lookDeadzone.

bind JOY17 "+attack"            // RT  fire
bind JOY16 "+altattack"         // LT  alt fire / scope / saber throw
bind JOY1  "+moveup"            // A   jump (hold for Force jump)
bind JOY2  "+movedown"          // B   crouch
bind JOY3  "+use"               // X   use / open / talk
bind JOY4  "+useforce"          // Y   use selected Force power
bind JOY11 "weapnext"           // RB  next weapon
bind JOY10 "weapprev"           // LB  previous weapon
bind JOY12 "forcenext"          // D-pad up    next Force power
bind JOY13 "forceprev"          // D-pad down  previous Force power
bind JOY14 "invnext"            // D-pad left  next item
bind JOY15 "invuse"             // D-pad right use item (bacta, binoculars, ...)
bind JOY8  "saberAttackCycle"   // left stick click  saber style
bind JOY9  "force_throw"        // right stick click Force push
bind JOY5  "datapad"            // Back  datapad / objectives
